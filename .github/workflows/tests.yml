name: Tests

# Fast tests only: anything marked `slow` needs the parquet store, which is
# gitignored and lives in the paper-trading job's cache.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:        # the deploy runs this suite first and waits for it (deploy.yml)

permissions:
  contents: read

concurrency:
  # The workflow's name is in the group: on a push to main this suite runs twice, once here and once called
  # by the deploy, and the two must not cancel each other.
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest becomes Ubuntu 26 from 19 Oct 2026
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # No pip cache: setup-python saved ~3 GiB per branch and pull request, which
      # pushed the repository past GitHub's 10 GB and evicted the paper job's NSE
      # archive cache (8 Oct 2026); installing afresh costs about a minute.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt "coverage==7.6.10"
      - name: Run the fast suite
        run: python -m coverage run --source=nse_engine,kite_connect -m pytest tests -q -m "not slow"
      # A ratchet, not a target: the code that sends orders, places stops or gates live trading may not lose
      # tests.  Each floor is the file's coverage in this job less 2 points, last raised 15 Nov 2026; raise one
      # when tests are added.
      - name: Live-path coverage floors
        run: |
          python -m coverage json -q -o coverage.json
          python - <<'EOF'
          import json, sys
          FLOORS = {
              "kite_connect/trading/order_service.py": 66, "kite_connect/trading/live_session.py": 48,
              "kite_connect/trading/nse_engine_executor.py": 43, "kite_connect/trading/gtt_stops.py": 86,
              "kite_connect/trading/kill_switch.py": 91, "kite_connect/trading/nse_instruments.py": 82,
              "kite_connect/trading/order_status.py": 98, "kite_connect/auth/daily_login.py": 21,
              "kite_connect/auth/accounts.py": 32, "nse_engine/engine.py": 69,
              "nse_engine/costs.py": 89, "nse_engine/portfolio.py": 83,
              "nse_engine/data/store.py": 49, "nse_engine/capital_ladder.py": 76,
              "nse_engine/live_rules.py": 25, "nse_engine/live_monitor.py": 72,
              "nse_engine/deployment.py": 56, "nse_engine/mc_bands.py": 55,
              "nse_engine/nse_calendar.py": 93, "nse_engine/universe.py": 83,
          }
          files = json.load(open("coverage.json"))["files"]
          low = []
          for path, floor in FLOORS.items():
              got = files.get(path, {}).get("summary", {}).get("percent_covered", 0.0)
              print(f"{path:48s} {got:5.1f}%  (floor {floor}%)")
              if got < floor:
                  low.append(f"{path}: {got:.1f}% < {floor}%")
          if low:
              sys.exit("coverage fell below its floor:\n  " + "\n  ".join(low))
          EOF

  # The same suite with the packages the web, scheduler and chart tests need, at the Space's pins.  The core
  # job above proves the paper path runs on the core install alone, where those tests skip; here nothing may
  # skip, because a skipped test checked nothing (tests/conftest.py, CENTURION_NO_SKIPS).
  pytest-all:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the core and the web packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt -c constraints-hf.txt fastapi httpx apscheduler matplotlib \
            bcrypt itsdangerous python-multipart "kiteconnect==5.1.0"
      - name: Run the fast suite, no skips allowed
        env:
          CENTURION_NO_SKIPS: "1"
        run: python -m pytest tests -q -m "not slow"

