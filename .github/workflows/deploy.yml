name: Deploy Backend to HF Spaces
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-hf-spaces:
    name: Deploy to Hugging Face Spaces
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest becomes Ubuntu 26 from 19 Oct 2026
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Clone HF Space repo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://srees16:${HF_TOKEN}@huggingface.co/spaces/srees16/centurion-core /tmp/hf-space

      - name: Copy application files
        run: |
          # Sync files from GitHub checkout to HF Space repo, excluding
          # dev artifacts, large files, frontend, and secrets
          rsync -a --delete \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='myenv' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='frontend' \
            --exclude='chroma_store' \
            --exclude='financial_ML/_cache' \
            --exclude='financial_ML/_output' \
            --exclude='rag_pipeline/ingest_docs' \
            --exclude='data/rag_uploads' \
            --exclude='data/bhavcopy_cache' \
            --exclude='data/chroma_db' \
            --exclude='data/event_logs' \
            --exclude='data/rl_models' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.pyc' \
            --exclude='*.pdf' \
            --exclude='*.sqlite3' \
            --exclude='*_original.png' \
            --exclude='*_original.jpg' \
            --exclude='_test_*' \
            --exclude='_debug_*' \
            --exclude='_compare_*' \
            ./ /tmp/hf-space/

          # Remove large dirs/files that rsync --exclude preserves from prior uploads
          rm -rf /tmp/hf-space/rag_pipeline/ingest_docs
          find /tmp/hf-space -not -path '*/.git/*' -name '*.pdf' -type f -delete
          find /tmp/hf-space -not -path '*/.git/*' -name '*_original.png' -type f -delete
          find /tmp/hf-space -not -path '*/.git/*' -name '*_original.jpg' -type f -delete

      - name: Credentials as a Space secret, and HF-specific files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CREDENTIALS_YAML: ${{ secrets.CREDENTIALS_YAML }}
          # MU2: the sign-up emails use the same SMTP account as the paper emails
          CENTURION_EMAIL_HOST: ${{ secrets.CENTURION_EMAIL_HOST }}
          CENTURION_EMAIL_PORT: ${{ secrets.CENTURION_EMAIL_PORT }}
          CENTURION_EMAIL_USER: ${{ secrets.CENTURION_EMAIL_USER }}
          CENTURION_EMAIL_PASS: ${{ secrets.CENTURION_EMAIL_PASS }}
        run: |
          # The Space is public: its repository must never hold the login
          # hashes. The API reads them from the CENTURION_CREDENTIALS_YAML
          # secret (api/auth.py), set here from the GitHub secret; the SMTP
          # settings are copied the same way (those set in GitHub only).
          pip install -q huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import add_space_secret
          add_space_secret("srees16/centurion-core", "CENTURION_CREDENTIALS_YAML",
                           os.environ["CREDENTIALS_YAML"], token=os.environ["HF_TOKEN"])
          for name in ("CENTURION_EMAIL_HOST", "CENTURION_EMAIL_PORT", "CENTURION_EMAIL_USER", "CENTURION_EMAIL_PASS"):
              if os.environ.get(name, "").strip():
                  add_space_secret("srees16/centurion-core", name, os.environ[name], token=os.environ["HF_TOKEN"])
          PY
          rm -f /tmp/hf-space/auth/credentials.yaml

          # HF-specific Dockerfile and README
          cp deployment/Dockerfile.hf /tmp/hf-space/Dockerfile
          cp deployment/hf-spaces/README.md /tmp/hf-space/README.md

      - name: Validate file sizes
        run: |
          LARGE=$(find /tmp/hf-space -not -path '*/.git/*' -type f -size +10M 2>/dev/null)
          if [ -n "$LARGE" ]; then
            echo "ERROR: Files exceeding 10 MB:"
            echo "$LARGE" | while read f; do echo "  $(du -h "$f" | cut -f1)  $f"; done
            exit 1
          fi
          echo "All files under 10 MB - OK"

      - name: Push to HF Spaces
        run: |
          cd /tmp/hf-space
          # Minimal .gitignore; credentials never go into the Space repo
          printf '__pycache__/\n*.pyc\n.env\n.env.*\nauth/credentials.yaml\n' > .gitignore

          git config user.email "ci@centurion.dev"
          git config user.name "Centurion CI"
          git add -A
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          git commit -m "Deploy from GitHub main ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
