name: Paper Trading Cron

on:
  schedule:
    # IST = UTC+5:30.
    # NSE engine EOD. The on-time start is an external workflow_dispatch at
    # 19:30 IST Mon-Fri (cron-job.org, POST .../actions/workflows/
    # nse-paper-trading.yml/dispatches): GitHub's scheduler is best-effort and
    # delivered these crons 1-4 hours late or not at all. These two are
    # backups only. Re-running a session is safe - stops and fills run once
    # per session (engine_last_session), later runs only re-plan - and the
    # 22:07 run also picks up a bhavcopy that was published after 19:30.
    # Minutes avoid the congested top of the hour. Keep these strings in sync
    # with the job conditions.
    - cron: "30 13 * * 1-5"   # 19:00 IST - the intended daily start
    - cron: "35 14 * * 1-5"   # 20:05 IST - backups, because GitHub runs late
    - cron: "35 15 * * 1-5"   # 21:05 IST
    - cron: "35 16 * * 1-5"   # 22:05 IST
    # Saturday weekly checkpoint: 7:30 AM IST = 2:00 AM UTC
    - cron: "0 2 * * 6"
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual trigger reason"
        required: false
        default: "manual"
      full_bootstrap:
        description: "NSE engine: sync the archive from paper_start_date - 3 years and rebuild every store year"
        required: false
        type: boolean
        default: false
      new_book:
        description: "NSE engine: start a fresh paper book at CENTURION_PAPER_INITIAL_CAPITAL (history kept, scoped by epoch)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# The paper book lives in Neon and is restored every run: never let two runs
# mutate it concurrently.
concurrency:
  group: paper-trade-book-v2
  cancel-in-progress: false

jobs:
  # Legacy pipeline when the NSE engine is off (repository variable
  # CENTURION_NSE_ENGINE != 'true').  With the engine on, this job only runs
  # the Saturday weekly checkpoint (no market data needed).
  paper-trade:
    if: >-
      (vars.CENTURION_NSE_ENGINE != 'true' && github.event.schedule != '0 2 * * 6')
      || (vars.CENTURION_NSE_ENGINE == 'true' && github.event.schedule == '0 2 * * 6')
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest becomes Ubuntu 26 from 19 Oct 2026
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ "${{ vars.CENTURION_NSE_ENGINE }}" = "true" ]; then
            pip install -r requirements-core.txt       # Saturday checkpoint, engine path
          else
            pip install -r requirements.txt            # legacy pipeline needs the full set
          fi

      - name: Run paper trading pipeline
        env:
          CENTURION_DATABASE_URL: ${{ secrets.CENTURION_DATABASE_URL }}
          CENTURION_PAPER_TRADE: "true"
          CENTURION_EMAIL_USER: ${{ secrets.CENTURION_EMAIL_USER }}
          CENTURION_EMAIL_PASS: ${{ secrets.CENTURION_EMAIL_PASS }}
          CENTURION_EMAIL_HOST: ${{ secrets.CENTURION_EMAIL_HOST }}
          CENTURION_EMAIL_PORT: ${{ secrets.CENTURION_EMAIL_PORT }}
          # Starting capital for the very first run only (later runs restore from Neon)
          CENTURION_PAPER_INITIAL_CAPITAL: ${{ vars.CENTURION_PAPER_INITIAL_CAPITAL || '100000' }}
          # NSE engine path is opt-in until validated (repository variable)
          CENTURION_NSE_ENGINE: ${{ vars.CENTURION_NSE_ENGINE || 'false' }}
        run: |
          if [ "$CENTURION_NSE_ENGINE" = "true" ]; then
            python cloud_paper_runner.py --engine
          else
            python cloud_paper_runner.py
          fi

      # Extra paper books (D1, D5): see "Extra paper books - shift reference and session".
      - name: Extra paper books - weekly checkpoint
        if: vars.CENTURION_NSE_ENGINE == 'true'
        continue-on-error: true
        env:
          CENTURION_PAPER_TRADE: "true"
          CENTURION_NSE_ENGINE: "true"
          CENTURION_PAPER_INITIAL_CAPITAL: ${{ vars.CENTURION_PAPER_INITIAL_CAPITAL || '100000' }}
          CENTURION_DATABASE_URL: ${{ secrets.CENTURION_DATABASE_URL }}
          CENTURION_EMAIL_USER: ${{ secrets.CENTURION_EMAIL_USER }}
          CENTURION_EMAIL_PASS: ${{ secrets.CENTURION_EMAIL_PASS }}
          CENTURION_EMAIL_HOST: ${{ secrets.CENTURION_EMAIL_HOST }}
          CENTURION_EMAIL_PORT: ${{ secrets.CENTURION_EMAIL_PORT }}
        run: |
          failed=""
          for CFG in config/nse_engine_*.json; do
            BOOK=$(basename "$CFG" .json); BOOK=${BOOK#nse_engine_}
            [ "$BOOK" = deployed ] && continue
            START=$(python -m nse_engine.deployment --path "$CFG" get paper_start_date) || START=""
            if [[ "$(TZ=Asia/Kolkata date +%F)" < "$START" ]]; then echo "$BOOK starts $START"; continue; fi
            CENTURION_NSE_DEPLOYMENT="$CFG" CENTURION_PAPER_SCHEMA="$BOOK" CENTURION_PAPER_BOOK_LABEL="$BOOK" \
              CENTURION_PAPER_DB_PATH="$RUNNER_TEMP/$BOOK/paper_trades.sqlite3" python cloud_paper_runner.py --engine ||
              failed="$failed $BOOK"
          done
          [ -z "$failed" ] || { echo "::error::weekly checkpoint failed for:$failed"; exit 1; }

      # Tracker V4: every book against the deployed one, the forward gate per
      # trial, the register attached; a cleared trial gets its promotion review.
      - name: Paper books - comparison report
        if: vars.CENTURION_NSE_ENGINE == 'true'
        continue-on-error: true
        env:
          CENTURION_DATABASE_URL: ${{ secrets.CENTURION_DATABASE_URL }}
          CENTURION_EMAIL_USER: ${{ secrets.CENTURION_EMAIL_USER }}
          CENTURION_EMAIL_PASS: ${{ secrets.CENTURION_EMAIL_PASS }}
          CENTURION_EMAIL_HOST: ${{ secrets.CENTURION_EMAIL_HOST }}
          CENTURION_EMAIL_PORT: ${{ secrets.CENTURION_EMAIL_PORT }}
        run: python -m tools.books_report

  # GitHub delivers scheduled runs 1-4 hours late (measured: a 22:05 IST cron
  # arrived at 01:20 IST). Snapshots are now dated by the trading session, not
  # the clock, so a late run is harmless - the window only stops a run so late
  # that it would trade on the next morning's stale plan. Four attempts an
  # evening make a missed session unlikely; re-runs of a processed session only
  # re-plan. Manual dispatches always run.
  engine-window:
    if: vars.CENTURION_NSE_ENGINE == 'true' && github.event.schedule != '' && github.event.schedule != '0 2 * * 6' 
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest becomes Ubuntu 26 from 19 Oct 2026
    timeout-minutes: 2
    outputs:
      in_window: ${{ steps.clock.outputs.in_window }}
    steps:
      - id: clock
        run: |
          now=$(TZ=Asia/Kolkata date +%H%M)
          if [ "$((10#$now))" -ge 1830 ] || [ "$((10#$now))" -le 559 ]; then
            echo "in_window=true" >> "$GITHUB_OUTPUT"
          else
            echo "in_window=false" >> "$GITHUB_OUTPUT"
            echo "::notice::scheduled run started at $now IST, outside 18:30-05:59 IST - skipped (it would plan on stale data)"
          fi

  # NSE engine paper trading (CENTURION_NSE_ENGINE == 'true'): once per
  # trading day after the bhavcopy is published.  Triggered, in order of
  # punctuality: the Hugging Face scheduler's 19:00 IST dispatch (exact), an
  # external cron-job.org POST if one is configured, then GitHub's own crons
  # above, which arrive 1-4 hours late.  Whichever lands first does the work;
  # the rest only re-plan.
  #
  # Data: data/nse_engine/{archive,store} are gitignored, so they live in the
  # Actions cache.  Every run restores the newest cache entry (restore-keys),
  # syncs recent sessions, rebuilds only the store years that changed and
  # saves a new entry (also when a later step fails, so a long first
  # bootstrap keeps its progress).
  #
  # First run (empty cache, no bootstrap marker, or full_bootstrap input):
  # sync from paper_start_date - 3 years.  About 3 years x ~310 candidate
  # sessions x 4 file kinds at 2 requests/s = ~3,000-4,000 requests, i.e.
  # 30-45 min of downloading plus ~5 min for the store; budget ~60-75 min
  # in total.  Later runs: ~12-20 min (mostly pip install, cache transfer,
  # the shift-reference backtest and the engine run).
  nse-engine-paper:
    needs: engine-window
    # !cancelled(): a dispatch skips engine-window, which must not skip this job.
    # main only: a dispatch from another branch would run the live book and write
    # every paper book with code that was never merged.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && vars.CENTURION_NSE_ENGINE == 'true'
      && (github.event_name == 'workflow_dispatch'
          || (github.event.schedule != '' && github.event.schedule != '0 2 * * 6'
              && needs.engine-window.outputs.in_window == 'true'))
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest becomes Ubuntu 26 from 19 Oct 2026
    timeout-minutes: 180
    env:
      ARCHIVE_DIR: data/nse_engine/archive
      CENTURION_PAPER_TRADE: "true"
      CENTURION_NSE_ENGINE: "true"
      CENTURION_NSE_DEPLOYMENT: ${{ vars.CENTURION_NSE_DEPLOYMENT || 'config/nse_engine_deployed.json' }}
      CENTURION_PAPER_INITIAL_CAPITAL: ${{ vars.CENTURION_PAPER_INITIAL_CAPITAL || '100000' }}
      NSE_SYNC_LOOKBACK_DAYS: ${{ vars.CENTURION_NSE_SYNC_LOOKBACK_DAYS || '14' }}
      NSE_ARCHIVE_RPS: ${{ vars.CENTURION_NSE_ARCHIVE_RPS || '2' }}
      FULL_BOOTSTRAP: ${{ github.event.inputs.full_bootstrap || 'false' }}
      NEW_BOOK: ${{ github.event.inputs.new_book || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h .

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Restore NSE archive and store cache
        id: nse-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/nse_engine/archive
            data/nse_engine/store
          key: nse-engine-data-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nse-engine-data-v1-

      - name: Resolve deployment and sync window
        id: window
        run: |
          python -m nse_engine.deployment show
          PAPER_START=$(python -m nse_engine.deployment get paper_start_date)
          BOOT_START=$(python -m nse_engine.deployment get bootstrap_start)
          TODAY=$(python -c "from datetime import datetime, timedelta, timezone; print(datetime.now(timezone(timedelta(hours=5, minutes=30))).date())")
          MARKER="$ARCHIVE_DIR/manifest/ci_bootstrap.json"
          MODE=incremental
          if [ "$FULL_BOOTSTRAP" = "true" ]; then
            MODE=bootstrap
          elif [ ! -f "$MARKER" ]; then
            MODE=bootstrap
          elif ! python -c "import json, sys; sys.exit(0 if json.load(open('$MARKER'))['start'] <= '$BOOT_START' else 1)"; then
            MODE=bootstrap   # deployment moved paper_start_date earlier
          fi
          if [ "$MODE" = "bootstrap" ]; then
            SYNC_START="$BOOT_START"
          else
            SYNC_START=$(python -c "from datetime import date, timedelta; print(date.fromisoformat('$TODAY') - timedelta(days=int('$NSE_SYNC_LOOKBACK_DAYS')))")
          fi
          echo "cache restored from: '${{ steps.nse-cache.outputs.cache-matched-key }}'"
          echo "mode=$MODE sync $SYNC_START..$TODAY paper_start=$PAPER_START"
          {
            echo "mode=$MODE"
            echo "sync_start=$SYNC_START"
            echo "boot_start=$BOOT_START"
            echo "paper_start=$PAPER_START"
            echo "today=$TODAY"
          } >> "$GITHUB_OUTPUT"

      - name: Sync NSE archive
        timeout-minutes: 150
        env:
          SYNC_START: ${{ steps.window.outputs.sync_start }}
          TODAY: ${{ steps.window.outputs.today }}
        run: |
          python -m nse_engine.data.archive --start "$SYNC_START" --end "$TODAY" \
            --root "$ARCHIVE_DIR" --rps "$NSE_ARCHIVE_RPS"
          du -sh "$ARCHIVE_DIR"

      - name: Mark bootstrap complete
        if: steps.window.outputs.mode == 'bootstrap'
        env:
          BOOT_START: ${{ steps.window.outputs.boot_start }}
          TODAY: ${{ steps.window.outputs.today }}
        run: |
          python - <<'EOF'
          import json, os
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path
          from nse_engine.data.archive import BhavcopyArchive, candidate_files, session_dates

          root = Path(os.environ["ARCHIVE_DIR"])
          start, today = date.fromisoformat(os.environ["BOOT_START"]), date.fromisoformat(os.environ["TODAY"])
          archive = BhavcopyArchive(root)
          # Every candidate equity session older than the publication grace must be a file or a known holiday
          gaps = [d for d in session_dates(start, today - timedelta(days=4))
                  if BhavcopyArchive.existing(candidate_files(root, "equity", d)) is None
                  and not archive.is_missing("equity", d)]
          if gaps:
              print(f"bootstrap incomplete: {len(gaps)} equity sessions missing, e.g. {gaps[:5]} - next run bootstraps again")
          else:
              marker = root / "manifest" / "ci_bootstrap.json"
              marker.parent.mkdir(parents=True, exist_ok=True)
              marker.write_text(json.dumps({"start": start.isoformat(), "end": today.isoformat(),
                                            "completed_at": datetime.now(timezone.utc).isoformat()}))
              print(f"bootstrap complete: {marker}")
          EOF

      - name: Build NSE store (changed years only)
        env:
          MODE: ${{ steps.window.outputs.mode }}
          SYNC_START: ${{ steps.window.outputs.sync_start }}
        run: |
          # NIFTY 50 sessions before NSE's daily index files (Feb 2012): the frozen copy the research
          # store uses, so this store hashes as the registry's (tracker LN-T13)
          ext=data/nse_engine/store/external/nifty50_history.parquet
          [ -f "$ext" ] || install -D -m 644 config/external/nifty50_history.parquet "$ext"
          python - <<'EOF'
          import json, logging, os
          from datetime import date
          from pathlib import Path
          from nse_engine.data.store import archive_years, build_store
          from nse_engine.deployment import load_deployment

          logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(name)s: %(message)s")
          archive = os.environ["ARCHIVE_DIR"]
          store = Path(load_deployment(os.environ["CENTURION_NSE_DEPLOYMENT"]).engine.data.store_dir)
          first = date.fromisoformat(os.environ["SYNC_START"]).year
          if os.environ["MODE"] == "bootstrap":
              years = None  # every archive year (unchanged years are skipped by fingerprint)
          else:
              # recently synced years, plus any year whose parquet is missing
              years = [y for y in archive_years(archive)
                       if y >= first or not (store / "equity" / f"{y}.parquet").exists()]
          summary = build_store(archive, store, years=years)
          print(json.dumps(summary, indent=2))
          for x in summary.get("suspect_missing_sessions", []):   # LN-T7: a session the archive lacks
              print(f"::error::a session seems missing from the store before {x['date']} "
                    f"({x['mismatched']} of {x['symbols']} prev_close values do not match)")
          EOF
          du -sh data/nse_engine/store

      # Every book's 2013-25 backtest against its expected statistics (tracker LN-T13): a code,
      # dependency or runner change that moves a book with its hashes unchanged is emailed, and
      # drift=true lets CENTURION_CANARY_DRIFT_ACTION=dry-run hold the live book to a dry run.
      - name: Book regression canary
        id: canary
        continue-on-error: true
        env:
          CENTURION_DATABASE_URL: ${{ secrets.CENTURION_DATABASE_URL }}
          CENTURION_EMAIL_USER: ${{ secrets.CENTURION_EMAIL_USER }}
          CENTURION_EMAIL_PASS: ${{ secrets.CENTURION_EMAIL_PASS }}
          CENTURION_EMAIL_HOST: ${{ secrets.CENTURION_EMAIL_HOST }}
          CENTURION_EMAIL_PORT: ${{ secrets.CENTURION_EMAIL_PORT }}
        run: python -m runners.run_nse_engine canary --tier actions

      - name: Regenerate same-period shift reference
        continue-on-error: true
        env:
          PAPER_START: ${{ steps.window.outputs.paper_start }}
          TODAY: ${{ steps.window.outputs.today }}
        run: |
          if [[ ! "$TODAY" > "$PAPER_START" ]]; then
            echo "paper trading starts $PAPER_START: no live window yet"
            exit 0
          fi
          python -m nse_engine.deployment write-engine-config --out "$RUNNER_TEMP/engine_config.json"
          python -m runners.run_nse_engine shift-reference --config "$RUNNER_TEMP/engine_config.json" \
            --start "$PAPER_START" --data-start "$(python -m nse_engine.deployment get data_start)" \
            --set initial_capital="$CENTURION_PAPER_INITIAL_CAPITAL"

      - name: Run NSE engine paper session
        env:
          CENTURION_DATABASE_URL: ${{ secrets.CENTURION_DATABASE_URL }}
          CENTURION_EMAIL_USER: ${{ secrets.CENTURION_EMAIL_USER }}
          CENTURION_EMAIL_PASS: ${{ secrets.CENTURION_EMAIL_PASS }}
          CENTURION_EMAIL_HOST: ${{ secrets.CENTURION_EMAIL_HOST }}
          CENTURION_EMAIL_PORT: ${{ secrets.CENTURION_EMAIL_PORT }}
          CENTURION_SHIFT_MAX_TRACKING_ERROR: ${{ vars.CENTURION_SHIFT_MAX_TRACKING_ERROR || '0.08' }}
          CENTURION_SHIFT_MAX_DAILY_GAP_BPS: ${{ vars.CENTURION_SHIFT_MAX_DAILY_GAP_BPS || '3' }}
        run: |
          EXTRA=""
          if [ "$NEW_BOOK" = "true" ]; then EXTRA="--new-book"; fi
          python cloud_paper_runner.py --engine $EXTRA

      # Live book (tracker L5, decision U23): off until the repository variable
      # CENTURION_LIVE_MODE is 'dry_run' (orders built from the real account,
      # none sent) or 'live' (real orders).  It needs today's Kite login - the
      # link in the reminder email (kite-login-reminder.yml) - and, for real
      # orders, the static-IP proxy whose IP is registered with Zerodha.  Runs
      # once per session across the backup crons.  Isolated like the candidate:
      # a failure emails and never touches the paper books.  It runs before the
      # candidate books, so a slow or failing paper book cannot hold it up.
      # Then each connected account Centurion manages (FA2, MU1, kite_connect/
      # auth/accounts.py) in its own book, through the same proxy, at its own
      # mode but never above this one, and none whose mode is locked (terms;
      # registration too for live); the go-live override is for your account only.  An
      # account's failure emails and the next still runs.  Their names, ids and
      # emails are masked first: this repo's logs are public.
      # Installed in a step of its own, so no package's install code runs beside the
      # proxy key, the token key and the database URL (SEC2).
      - name: Live book - install the Kite client
        if: vars.CENTURION_LIVE_MODE == 'dry_run' || vars.CENTURION_LIVE_MODE == 'live'
        continue-on-error: true
        run: pip install "kiteconnect==5.1.0" "PySocks==1.7.1"

      - name: Live book - session
        id: live
        if: vars.CENTURION_LIVE_MODE == 'dry_run' || vars.CENTURION_LIVE_MODE == 'live'
        continue-on-error: true
        env:
          CENTURION_DATABASE_URL: ${{ secrets.CENTURION_DATABASE_URL }}
          CENTURION_EMAIL_USER: ${{ secrets.CENTURION_EMAIL_USER }}
          CENTURION_EMAIL_PASS: ${{ secrets.CENTURION_EMAIL_PASS }}
          CENTURION_EMAIL_HOST: ${{ secrets.CENTURION_EMAIL_HOST }}
          CENTURION_EMAIL_PORT: ${{ secrets.CENTURION_EMAIL_PORT }}
          ZERODHA_API_KEY: ${{ secrets.ZERODHA_API_KEY }}
          CENTURION_KITE_TOKEN_KEY: ${{ secrets.CENTURION_KITE_TOKEN_KEY }}
          CENTURION_KITE_PROXY: ${{ secrets.CENTURION_KITE_PROXY }}
          # Oracle Cloud static IP via an SSH tunnel (deployment/oracle-proxy/README.md)
          CENTURION_PROXY_SSH_KEY: ${{ secrets.CENTURION_PROXY_SSH_KEY }}
          CENTURION_PROXY_HOST: ${{ secrets.CENTURION_PROXY_HOST }}
          CENTURION_PROXY_HOST_KEY: ${{ secrets.CENTURION_PROXY_HOST_KEY }}
          CENTURION_KITE_STATIC_IP: ${{ vars.CENTURION_KITE_STATIC_IP }}
          CENTURION_LIVE_CAPITAL: ${{ vars.CENTURION_LIVE_CAPITAL }}
          CANARY_DRIFT: ${{ steps.canary.outputs.drift }}
          CANARY_DRIFT_ACTION: ${{ vars.CENTURION_CANARY_DRIFT_ACTION }}
          # MU1: Centurion's registration, which unlocks the connected accounts' live orders
          CENTURION_ALGO_PROVIDER_ID: ${{ vars.CENTURION_ALGO_PROVIDER_ID }}
          CENTURION_SEBI_REGISTRATION: ${{ vars.CENTURION_SEBI_REGISTRATION }}
          # D3: the first real session needs the go-live checks, or this set to 'true'
          CENTURION_GO_LIVE_OVERRIDE: ${{ vars.CENTURION_GO_LIVE_OVERRIDE || 'false' }}
          CENTURION_KILL_SWITCH: ${{ vars.CENTURION_KILL_SWITCH || 'false' }}
          CENTURION_PAPER_TRADE: ${{ vars.CENTURION_LIVE_MODE == 'live' && 'false' || 'true' }}
          CENTURION_NSE_ENGINE_LIVE: ${{ vars.CENTURION_LIVE_MODE == 'live' && 'true' || 'false' }}
          LIVE_MODE: ${{ vars.CENTURION_LIVE_MODE }}
        run: |
          if [ -n "$CENTURION_PROXY_HOST" ]; then
            # Kite calls leave from the Oracle VM's reserved IP (the one Zerodha has).
            install -d -m 700 ~/.ssh
            (umask 077; printf '%s\n' "$CENTURION_PROXY_SSH_KEY" > ~/.ssh/kite_tunnel)
            printf '%s\n' "$CENTURION_PROXY_HOST_KEY" > ~/.ssh/known_hosts_kite
            ssh -i ~/.ssh/kite_tunnel -o UserKnownHostsFile="$HOME/.ssh/known_hosts_kite" \
                -o StrictHostKeyChecking=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 \
                -o BatchMode=yes -f -N -D 127.0.0.1:1080 "$CENTURION_PROXY_HOST"
            export CENTURION_KITE_PROXY="socks5h://127.0.0.1:1080"
          fi
          dry=""; [ "$LIVE_MODE" = "live" ] || dry="--dry-run"
          if [ "$CANARY_DRIFT" = "true" ] && [ "$CANARY_DRIFT_ACTION" = "dry-run" ]; then
            dry="--dry-run"; echo "::warning::canary drift: the live session runs as a dry run (CENTURION_CANARY_DRIFT_ACTION)"
          fi
          status=0
          python -m kite_connect.trading.live_session --stored-token $dry || status=$?
          python -m kite_connect.auth.accounts mask || { echo "::error::accounts skipped: log masks not set"; exit 1; }
          for ACCT in $(python -m kite_connect.auth.accounts managed); do
            echo "::group::account $ACCT"
            CENTURION_GO_LIVE_OVERRIDE=false python -m kite_connect.trading.live_session --stored-token \
                --account "$ACCT" $dry || {
              echo "::error::live session of account $ACCT failed"
              python -m tools.session_failed "${{ github.run_id }} (live book $ACCT)" || true
            }
            echo "::endgroup::"
          done
          exit $status

      - name: Tell me when the live session fails
        if: steps.live.outcome == 'failure'
        env:
          CENTURION_EMAIL_USER: ${{ secrets.CENTURION_EMAIL_USER }}
          CENTURION_EMAIL_PASS: ${{ secrets.CENTURION_EMAIL_PASS }}
          CENTURION_EMAIL_HOST: ${{ secrets.CENTURION_EMAIL_HOST }}
          CENTURION_EMAIL_PORT: ${{ secrets.CENTURION_EMAIL_PORT }}
        run: python -m tools.session_failed "${{ github.run_id }} (live book)"

      # Extra paper books (trackers D1, D5): every config/nse_engine_<book>.json
      # but the deployed one is a paper-only book (status 'candidate': live is
      # refused) traded beside the deployed book on the same data, in its own
      # Postgres schema (<book>), local file and same-period shift reference,
      # with emails tagged by book.  A new book is a new file.  Books are
      # isolated: a failure emails and the next book still runs.
      - name: Extra paper books - shift reference and session
        continue-on-error: true
        env:
          TODAY: ${{ steps.window.outputs.today }}
          CENTURION_DATABASE_URL: ${{ secrets.CENTURION_DATABASE_URL }}
          CENTURION_EMAIL_USER: ${{ secrets.CENTURION_EMAIL_USER }}
          CENTURION_EMAIL_PASS: ${{ secrets.CENTURION_EMAIL_PASS }}
          CENTURION_EMAIL_HOST: ${{ secrets.CENTURION_EMAIL_HOST }}
          CENTURION_EMAIL_PORT: ${{ secrets.CENTURION_EMAIL_PORT }}
          CENTURION_SHIFT_MAX_TRACKING_ERROR: ${{ vars.CENTURION_SHIFT_MAX_TRACKING_ERROR || '0.08' }}
          CENTURION_SHIFT_MAX_DAILY_GAP_BPS: ${{ vars.CENTURION_SHIFT_MAX_DAILY_GAP_BPS || '3' }}
        run: |
          failed=""
          for CFG in config/nse_engine_*.json; do
            BOOK=$(basename "$CFG" .json); BOOK=${BOOK#nse_engine_}
            [ "$BOOK" = deployed ] && continue
            echo "::group::paper book $BOOK"
            START=$(python -m nse_engine.deployment --path "$CFG" get paper_start_date) || START=""
            if [[ "$TODAY" < "$START" ]]; then echo "$BOOK paper trading starts $START"; echo "::endgroup::"; continue; fi
            if [[ "$TODAY" > "$START" ]]; then
              python -m nse_engine.deployment --path "$CFG" write-engine-config --out "$RUNNER_TEMP/${BOOK}_engine.json" &&
              python -m runners.run_nse_engine shift-reference --config "$RUNNER_TEMP/${BOOK}_engine.json" \
                --start "$START" --data-start "$(python -m nse_engine.deployment --path "$CFG" get data_start)" \
                --set initial_capital="$CENTURION_PAPER_INITIAL_CAPITAL" --out "data/shift_reference_${BOOK}.csv" ||
                echo "::warning::$BOOK shift reference failed"
            fi
            if ! CENTURION_NSE_DEPLOYMENT="$CFG" CENTURION_PAPER_SCHEMA="$BOOK" CENTURION_PAPER_BOOK_LABEL="$BOOK" \
                 CENTURION_PAPER_DB_PATH="$RUNNER_TEMP/$BOOK/paper_trades.sqlite3" \
                 CENTURION_SHIFT_REFERENCE_CSV="data/shift_reference_${BOOK}.csv" python cloud_paper_runner.py --engine; then
              failed="$failed $BOOK"
              python -m tools.session_failed "${{ github.run_id }} ($BOOK book)" || true
            fi
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "::error::paper book(s) failed:$failed"; exit 1; }

      - name: Tell me when a session fails
        if: failure()
        env:
          CENTURION_EMAIL_USER: ${{ secrets.CENTURION_EMAIL_USER }}
          CENTURION_EMAIL_PASS: ${{ secrets.CENTURION_EMAIL_PASS }}
          CENTURION_EMAIL_HOST: ${{ secrets.CENTURION_EMAIL_HOST }}
          CENTURION_EMAIL_PORT: ${{ secrets.CENTURION_EMAIL_PORT }}
        run: python -m tools.session_failed "${{ github.run_id }}"

      - name: Save NSE archive and store cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/nse_engine/archive
            data/nse_engine/store
          key: nse-engine-data-v1-${{ github.run_id }}-${{ github.run_attempt }}
