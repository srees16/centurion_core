name: NIFTY option-chain snapshots
# Tracker OX1, plan 5cg: a forward record of what NIFTY's options cost to trade (A1's real spread, decided on
# 18 Jan 2027).  A read-only quote call with the day's stored Kite login (daily_login); no orders, no alerts.
# GitHub delivers crons late, so the script skips outside 09:20-15:28 IST and on NSE holidays; four tries a day,
# the last two near the close, where A1 fills.
on:
  schedule:
    - cron: "30 5 * * 1-5"    # 11:00 IST
    - cron: "0 8 * * 1-5"     # 13:30 IST
    - cron: "30 9 * * 1-5"    # 15:00 IST
    - cron: "45 9 * * 1-5"    # 15:15 IST
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: option-chain
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-24.04   # pinned, as the ETF snapshots
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements-core.txt "kiteconnect==5.1.0"
      - name: Snapshot NIFTY's option chain
        env:
          CENTURION_DATABASE_URL: ${{ secrets.CENTURION_DATABASE_URL }}
          CENTURION_KITE_TOKEN_KEY: ${{ secrets.CENTURION_KITE_TOKEN_KEY }}
          ZERODHA_API_KEY: ${{ secrets.ZERODHA_API_KEY }}
        run: python -m kite_connect.options.chain_recorder snapshot
