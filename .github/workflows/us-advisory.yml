name: US Advisory

# US advisory book (tracker US-A1, docs/US_MEMORY_TRACKER.txt): after each US
# close, advance the model book and email the next session's suggestions.
# Advisory only: nothing here can place an order.  The book lives in Neon
# (schema us_advisory); logs show counts only (public repository).

on:
  schedule:
    # The morning after each US session (IST).  Yahoo publishes the stocks'
    # daily closes hours after the index's (15-16 Oct 2026: ~500 of 503
    # missing at 20:30 New York, complete by about 04:30 UTC), and GitHub
    # starts schedules late, so there are four tries, all before the 19:00
    # IST open (20:00 in the US winter).  A try without data exits quietly;
    # the last one alerts.  A rerun is safe: a planned session is not planned
    # again, and an unsent email is resent.  Minutes avoid the top of the hour.
    - cron: "17 4 * * 2-6"    # 09:47 IST Tue-Sat
    - cron: "17 6 * * 2-6"    # 11:47 IST
    - cron: "17 8 * * 2-6"    # 13:47 IST
    - cron: "17 10 * * 2-6"   # 15:47 IST, the last try
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: us-advisory-book
  cancel-in-progress: false

jobs:
  advise:
    runs-on: ubuntu-24.04   # pinned, as the paper workflow
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Plan the next US session
        env:
          CENTURION_DATABASE_URL: ${{ secrets.CENTURION_DATABASE_URL }}
          CENTURION_EMAIL_USER: ${{ secrets.CENTURION_EMAIL_USER }}
          CENTURION_EMAIL_PASS: ${{ secrets.CENTURION_EMAIL_PASS }}
          CENTURION_EMAIL_HOST: ${{ secrets.CENTURION_EMAIL_HOST }}
          CENTURION_EMAIL_PORT: ${{ secrets.CENTURION_EMAIL_PORT }}
          US_ADVISORY_CAPITAL_USD: ${{ vars.US_ADVISORY_CAPITAL_USD }}
          LAST_TRY: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 10 * * 2-6' }}
        run: |
          args=""
          if [ "$LAST_TRY" = "true" ]; then args="--last-attempt"; fi   # unpublished data alerts only here
          python -m us_engine.advisory run $args
