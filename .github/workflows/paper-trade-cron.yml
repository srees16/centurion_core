name: Paper Trading Cron

on:
  schedule:
    # IST = UTC+5:30. Market hours: 9:15 AM - 3:30 PM IST
    # Pre-market scan: 9:20 AM IST = 3:50 AM UTC
    - cron: "50 3 * * 1-5"
    # Intraday rescans: 10:30/12:30/14:30 IST = 5:00/7:00/9:00 UTC
    - cron: "0 5 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "0 9 * * 1-5"
    # EOD snapshot: 3:35 PM IST = 10:05 AM UTC
    - cron: "5 10 * * 1-5"
    # Saturday weekly checkpoint: 7:30 AM IST = 2:00 AM UTC
    - cron: "0 2 * * 6"
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual trigger reason"
        required: false
        default: "manual"

permissions:
  contents: read

# The paper book lives in Neon and is restored every run: never let two runs
# mutate it concurrently.
concurrency:
  group: paper-trade-book
  cancel-in-progress: false

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run paper trading pipeline
        env:
          CENTURION_DATABASE_URL: ${{ secrets.CENTURION_DATABASE_URL }}
          CENTURION_PAPER_TRADE: "true"
          CENTURION_EMAIL_USER: ${{ secrets.CENTURION_EMAIL_USER }}
          CENTURION_EMAIL_PASS: ${{ secrets.CENTURION_EMAIL_PASS }}
          CENTURION_EMAIL_HOST: ${{ secrets.CENTURION_EMAIL_HOST }}
          CENTURION_EMAIL_PORT: ${{ secrets.CENTURION_EMAIL_PORT }}
          # Starting capital for the very first run only (later runs restore from Neon)
          CENTURION_PAPER_INITIAL_CAPITAL: ${{ vars.CENTURION_PAPER_INITIAL_CAPITAL || '100000' }}
          # NSE engine path is opt-in until validated (repository variable)
          CENTURION_NSE_ENGINE: ${{ vars.CENTURION_NSE_ENGINE || 'false' }}
        run: |
          if [ "$CENTURION_NSE_ENGINE" = "true" ]; then
            python cloud_paper_runner.py --engine
          else
            python cloud_paper_runner.py
          fi
